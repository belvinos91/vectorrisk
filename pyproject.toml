[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorrisk"
version = "1.0.0"
description = "Stochastic temperature--rainfall mosquito-abundance risk toolkit and API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Affognon, S. B. and Kilonzo, C. M."}]
keywords = ["mosquito", "abundance", "stochastic", "girsanov", "fokker-planck",
            "worldclim", "vector-control", "risk-mapping"]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
# real-time climate + sub-national polygons (WorldClim / GADM)
geo = ["rasterio>=1.3", "geopandas>=0.13", "shapely>=2.0", "pyproj>=3.4", "requests>=2.28"]
# the FastAPI backend
api = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "pydantic>=2.0"]
# figures for the batch pipeline
viz = ["matplotlib>=3.6", "pandas>=1.5", "tqdm>=4.64"]
# year-specific climate for validation panels (TerraClimate/CHIRPS)
ts = ["xarray>=2023.1", "rioxarray>=0.13", "netCDF4>=1.6"]
# everything
full = ["rasterio>=1.3", "geopandas>=0.13", "shapely>=2.0", "pyproj>=3.4",
        "requests>=2.28", "fastapi>=0.104", "uvicorn[standard]>=0.24",
        "pydantic>=2.0", "matplotlib>=3.6", "pandas>=1.5", "tqdm>=4.64",
        "xarray>=2023.1", "rioxarray>=0.13", "netCDF4>=1.6"]

[project.scripts]
vectorrisk = "vectorrisk.cli:main"

[tool.setuptools]
packages = ["vectorrisk"]
